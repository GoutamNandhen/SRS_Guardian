name: M51 itsdangerous Pinned External Review (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m51-itsdangerous-transfer-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m51_itsdangerous_full_tree_review.py'
      - 'backend/tests/test_m51_itsdangerous_full_tree_review.py'
      - '.github/workflows/srs2-m51-itsdangerous-review.yml'
permissions:
  contents: read
jobs:
  first-party-static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed first-party test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: Run offline first-party tests
        run: python -m pytest -q backend/tests/test_m51_itsdangerous_full_tree_review.py
      - name: Fetch pinned public Git source as inert bytes, verify all blobs and license, rank, prepare M20 review
        run: python -m backend.evaluation.m51_itsdangerous_full_tree_review --out-dir /tmp/m51_itsdangerous
      - name: Verify evidence remains pending, not independent gold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/m51_itsdangerous')
          data = json.loads((root/'INTERNAL_DO_NOT_SHARE.json').read_text())
          assert data['project'] == 'pallets/itsdangerous'
          assert data['license'].startswith('BSD-3-Clause')
          assert data['revision_cases'] == 2
          assert data['candidates_per_reviewer'] == 10
          assert data['independent_adjudications'] == 0
          assert data['approved_behavioral_observations'] == 0
          assert data['held_out'] is False
          assert data['external_code_executed'] is False
          assert all(data[k] is None for k in (
              'conformance_accuracy', 'violation_precision',
              'violation_recall', 'coverage'))
          assert len((root/'reviewer_A.jsonl').read_text().splitlines()) == 10
          assert len((root/'reviewer_B.jsonl').read_text().splitlines()) == 10
          print('External inert-source M20 packets generated; NO GOLD or accuracy')
          print(json.dumps({k:v['first_party_python_files'] for k,v in data['revisions'].items()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m51-itsdangerous-frozen-transfer-review-NOT-GOLD
          path: /tmp/m51_itsdangerous/
          retention-days: 14
