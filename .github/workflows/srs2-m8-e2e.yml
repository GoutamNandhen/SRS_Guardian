name: SRS Guardian 2 M8 Docker End-to-End and Frontend Build
on:
  push:
    branches:
      - feature/srs-guardian2-m8-docker-e2e-20261026
  pull_request:
    paths:
      - 'backend/evaluation/m8_docker_e2e.py'
      - '.github/workflows/srs2-m8-e2e.yml'
      - 'examples/m4/**'
      - 'backend/app/research/**'
      - 'frontend/**'
permissions:
  contents: read
jobs:
  trusted-container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install 'fastapi==0.115.12' 'httpx==0.28.1' 'pytest==8.4.2' 'python-multipart==0.0.20' 'SQLAlchemy==2.0.44'
      - name: Verify Docker daemon is local
        run: |
          unset DOCKER_HOST
          docker info --format 'Server version: {{.ServerVersion}}'
      - name: Build the trusted sample image from reviewed repository source
        run: docker build -f examples/m4/Dockerfile -t srs-m8-trusted-banking:ci .
      - name: Execute actual restricted Docker M2-to-M4 test
        run: |
          python -m backend.evaluation.m8_docker_e2e --out /tmp/srs-m8-docker-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('/tmp/srs-m8-docker-evidence.json').read_text())
          assert evidence['docker_executed'] is True
          assert evidence['all_expectations_met'] is True
          assert evidence['research_95_eligible'] is False
          assert [r['observed_decision'] for r in evidence['results']] == ['passed_available_checks', 'observed_violation']
          assert all(len(r['cases'])==2 for r in evidence['results'])
          print('Trusted full Docker E2E verified; no 95 percent real-world claim')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: srs-m8-docker-e2e-evidence
          path: /tmp/srs-m8-docker-evidence.json
          retention-days: 14
  consolidated-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused end-to-end engineering dependencies
        run: python -m pip install 'fastapi==0.115.12' 'httpx==0.28.1' 'pytest==8.4.2' 'python-multipart==0.0.20' 'SQLAlchemy==2.0.44' 'scikit-learn==1.7.2'
      - name: Compile all research and verification modules
        run: python -m compileall -q backend/evaluation backend/app/research backend/app/services/code_traceability.py backend/app/services/conformance_verification.py
      - name: Run M1-M7 combined regression without fabricated metrics
        run: |
          python -m pytest -q \
            backend/tests/test_evaluate_conformance.py \
            backend/tests/test_code_traceability.py \
            backend/tests/test_conformance_verification.py \
            backend/tests/test_m4_approved_runner.py \
            backend/tests/test_m5_research_benchmark.py \
            backend/tests/test_m6_external_trace.py \
            backend/tests/test_m7_hybrid_retrieval.py
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Check frontend TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
