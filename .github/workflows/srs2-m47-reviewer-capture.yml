name: SRS Guardian M47 Approved Reviewer Capture (First Party Only)
on:
  push:
    branches:
      - feature/srs-guardian2-m47-pinned-reviewer-capture-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m47_requests_approved_reviewer_capture.py'
      - 'backend/tests/test_m47_requests_approved_reviewer_capture.py'
      - '.github/workflows/srs2-m47-reviewer-capture.yml'
permissions:
  contents: read
jobs:
  first-party-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: Test first-party capture helpers only (no upstream Requests execution)
        run: python -m pytest -q backend/tests/test_m47_requests_approved_reviewer_capture.py
      - name: Test first-party M45 fixture only
        run: python -m pytest -q backend/tests/test_m45_redirect_observation_fixture.py
