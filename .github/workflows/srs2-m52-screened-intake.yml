name: M52 Human-Screened External Intake (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m52-human-screened-intake-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m52_swebench_verified_intake.py'
      - 'backend/tests/test_m52_swebench_verified_intake.py'
      - '.github/workflows/srs2-m52-screened-intake.yml'
permissions:
  contents: read
jobs:
  pinned-inert-dataset-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install first-party test and inert parquet reader
        run: python -m pip install 'pytest==8.4.2' 'pyarrow==17.0.0'
      - name: Run first-party tests without external code
        run: python -m pytest -q backend/tests/test_m52_swebench_verified_intake.py
      - name: Read pinned human-screened dataset as inert data; verify pinned project license
        run: python -m backend.evaluation.m52_swebench_verified_intake --out-dir /tmp/m52
      - name: Check no invented labels or held-out scores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/m52/INTERNAL_PROVENANCE_NOT_GOLD.json')
          m = json.loads(p.read_text())
          assert m['selected_count'] == 3
          assert m['external_code_executed'] is False
          assert m['independent_link_labels'] == 0
          assert m['independent_behavioral_labels'] == 0
          assert m['held_out_projects_scored'] == 0
          assert all(m[k] is None for k in ('conformance_accuracy','violation_precision','violation_recall','coverage'))
          assert all(not c['source_tree_blobs_verified'] for c in m['candidate_cases'])
          print('M52 external human-screened candidates verified, NOT conformance gold')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m52-human-screened-candidates-NOT-GOLD
          path: /tmp/m52/
          retention-days: 14
