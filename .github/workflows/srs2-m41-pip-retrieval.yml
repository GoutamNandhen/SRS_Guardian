name: SRS Guardian M41 Pip Retrieval Bottleneck
on:
  push:
    branches:
      - feature/srs-guardian2-m41-pip-retrieval-ablation-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m41_pip_retrieval_ablation.py'
      - 'backend/tests/test_m41_pip_retrieval_ablation.py'
      - 'docs/research/M41_PIP_RETRIEVAL_ABLATION.md'
      - '.github/workflows/srs2-m41-pip-retrieval.yml'
permissions:
  contents: read
jobs:
  real-pip-retrieval-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: First-party regression tests only
        run: python -m pytest -q backend/tests/test_m34_pip_source_structure_witness.py backend/tests/test_m40_pip_e2e_feasibility.py backend/tests/test_m41_pip_retrieval_ablation.py
      - name: Hash-verify pinned MIT pip static text and run M41 ablation
        run: |
          python -m backend.evaluation.m41_pip_retrieval_ablation --out-dir /tmp/m41
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('/tmp/m41/m41_retrieval_ablation.json').read_text())
          assert m['verified_static_file_revision_objects'] == 6
          assert m['requirement_revision_pairs'] == 6
          assert m['behavioral_abstentions'] == 6
          assert m['behavioral_decisions'] == 0
          assert m['independent_adjudications'] == 0
          assert m['held_out_project_evaluation'] is False
          assert m['external_project_code_executed'] is False
          assert all(m[key] is None for key in
                     ('conformance_accuracy','violation_precision',
                      'violation_recall','conformance_coverage'))
          assert any('ORACLE FILE SCOPE' in note for note in m['limitations'])
          for method, counts in m['ablation'].items():
              print(method, 'known-fix top1', counts['known_fix_locus_top1_exploratory'],
                    'top5', counts['known_fix_locus_top5_exploratory'], '/ 6; NOT GOLD')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m41-pip-retrieval-ablation-ORACLE-SCOPE-NOT-GOLD
          path: /tmp/m41/
          retention-days: 14
