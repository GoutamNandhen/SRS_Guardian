name: M60 Django Static Userinfo Property Demonstration (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m60-django-static-userinfo-20261029
  pull_request:
    paths:
      - 'backend/evaluation/m60_django_static_userinfo_verification.py'
      - 'backend/tests/test_m60_django_static_userinfo_verification.py'
      - '.github/workflows/srs2-m60-django-static-property.yml'
permissions:
  contents: read
jobs:
  static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned first-party test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: First-party offline synthetic tests only
        run: python -m pytest -q backend/tests/test_m60_django_static_userinfo_verification.py
      - name: Read and verify pinned Django Git blobs, statically inspect source only
        run: python -m backend.evaluation.m60_django_static_userinfo_verification --out-dir /tmp/m60_django
      - name: Verify real static before/after result without behavioral claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/m60_django/INTERNAL_STATIC_DEVELOPMENT_NOT_GOLD.json')
          d = json.loads(p.read_text())
          assert [r['static_result'] for r in d['revisions']] == ['static_rule_violated', 'static_rule_satisfied']
          assert all(r['license'] == 'BSD-3-Clause' and r['source_line'] > 0 for r in d['revisions'])
          assert d['external_project_code_executed'] is False
          assert d['independent_annotation'] is None
          assert d['independent_behavioral_observations'] == 0
          assert d['adjudications'] == 0
          assert d['held_out_projects_scored'] == 0
          assert all(d[k] is None for k in ('conformance_accuracy', 'violation_precision', 'violation_recall', 'coverage'))
          print('Two pinned real-source static property checks; NO behavioral gold or metrics')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m60-django-static-development-NOT-GOLD
          path: /tmp/m60_django/
          retention-days: 14
