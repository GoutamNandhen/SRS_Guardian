name: SRS Guardian M43 Retrieval-Gated Static Witness
on:
  push:
    branches:
      - feature/srs-guardian2-m43-retrieval-gated-witness-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m43_pip_retrieval_gated_witness.py'
      - 'backend/tests/test_m43_pip_retrieval_gated_witness.py'
      - '.github/workflows/srs2-m43-retrieval-gated-witness.yml'
permissions:
  contents: read
jobs:
  retrieval-gated-source-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: First-party unit and pinned retrieval regression tests
        run: |
          python -m pytest -q backend/tests/test_m34_pip_source_structure_witness.py backend/tests/test_m40_pip_e2e_feasibility.py backend/tests/test_m41_pip_retrieval_ablation.py backend/tests/test_m42_pip_first_party_tree_retrieval.py backend/tests/test_m43_pip_retrieval_gated_witness.py
      - name: Reproduce hash-verified full-tree retrieval to source-pattern witness
        run: |
          python -m backend.evaluation.m43_pip_retrieval_gated_witness --out-dir /tmp/m43
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/m43/m43_retrieval_gated_witness.json').read_text())
          assert r['requirement_revision_pairs'] == 6
          assert r['retrieval_top_k'] == 5
          assert r['retrieval_method'] == 'normalized_tokens'
          assert sum(r['witness_status_counts'].values()) == 6
          assert r['retrieval_gated_source_witness_cases'] == r['witness_status_counts']['static_source_pattern_recognized']
          assert r['independent_adjudications'] == 0
          assert r['behavioral_decisions'] == 0
          assert r['behavioral_abstentions'] == 6
          assert r['held_out_project_evaluation'] is False
          assert r['external_project_code_executed'] is False
          assert all(r[k] is None for k in ('conformance_accuracy', 'violation_precision', 'violation_recall', 'conformance_coverage'))
          for row in r['cases']:
              assert row['behavioral_decision'] == 'insufficient_evidence'
              assert row['independent_gold'] is None
              if row['retrieval_gated_source_witness']:
                  w = row['retrieval_gated_source_witness']
                  assert w['retrieval_rank'] <= 5
                  assert w['source_git_blob_sha1'] in [x['git_blob_sha1'] for x in []] if False else len(w['source_git_blob_sha1']) == 40
          print('Gated source witnesses:', r['retrieval_gated_source_witness_cases'], '/6 (NOT behavioral conformance)')
          print('Per revision:', r['per_revision'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m43-pip-retrieval-gated-source-witness-NOT-GOLD
          path: /tmp/m43/
          retention-days: 14
