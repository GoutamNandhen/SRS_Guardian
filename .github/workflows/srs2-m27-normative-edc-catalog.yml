name: SRS Guardian M27 Normative DSP to EDC Review
on:
  push:
    branches:
      - feature/srs-guardian2-m27-normative-catalog-to-edc-review-20261027
  pull_request:
    paths:
      - 'backend/evaluation/m27_normative_edc_catalog.py'
      - 'backend/tests/test_m27_normative_edc_catalog.py'
      - '.github/workflows/srs2-m27-normative-edc-catalog.yml'
permissions:
  contents: read
jobs:
  normative-static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install 'pytest==8.4.2' 'scikit-learn==1.7.2'
      - name: Run offline M20-M27 regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_m20_annotation_queue.py \
            backend/tests/test_m23_teastore_external.py \
            backend/tests/test_m24_cross_corpus_baseline.py \
            backend/tests/test_m25_source_grounded_teastore.py \
            backend/tests/test_m26_dsp_tck_transfer.py \
            backend/tests/test_m27_normative_edc_catalog.py
      - name: Fetch nine immutable Apache-2.0 static source files and prepare M20 review
        run: python -m backend.evaluation.m27_normative_edc_catalog --out-dir /tmp/m27
      - name: Validate zero independent gold and review packet separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/m27')
          review = root / 'reviewers'
          internal = root / 'internal'
          b = json.loads((internal / 'internal.json').read_text())
          source = json.loads((review / 'source_index.json').read_text())
          q = [json.loads(s) for s in (review / 'blind_queue.jsonl').read_text().splitlines()]
          assert b['static_files_git_hash_verified'] == 9
          assert b['normative_requirements'] == 4
          assert b['real_implementation_java_files'] == 4
          assert b['external_tck_java_files'] == 1
          assert len(q) == 16
          assert len(source['requirements']) == 4
          assert len(source['implementation_files']) == 4
          assert 'observed_links' not in json.dumps(source)
          assert not (review / 'manifest.json').exists()
          assert all('origin' not in row and 'link_label' not in row for row in q)
          for reviewer in ('A', 'B'):
              links = [json.loads(s) for s in (review / f'reviewer_{reviewer}.jsonl').read_text().splitlines()]
              behavior = [json.loads(s) for s in (review / f'behavior_reviewer_{reviewer}.jsonl').read_text().splitlines()]
              assert len(links) == 16 and len(behavior) == 4
              assert all(r['link_label'] is None and r['annotation_status'] == 'pending' for r in links)
              assert all(r['conformance_label'] is None and r['violation_label'] is None for r in behavior)
          assert b['independently_adjudicated_link_pairs'] == 0
          assert b['independently_adjudicated_behavioral_cases'] == 0
          assert b['independent_gold'] is False
          assert b['held_out_project_accuracy_eligible'] is False
          for metric in ('conformance_accuracy', 'violation_precision', 'violation_recall', 'conformance_coverage'):
              assert b[metric] is None
          print('M27: 9 pinned static files, 4 normative clauses, 4 real EDC implementation files, 16 unlabeled links and 4 unanswered behavioral cases.')
          PY
      - name: Upload blinded reviewer-only packet
        uses: actions/upload-artifact@v4
        with:
          name: m27-normative-edc-blinded-reviewers
          path: /tmp/m27/reviewers/
          retention-days: 30
      - name: Upload internal provenance and unscored retrieval rankings separately
        uses: actions/upload-artifact@v4
        with:
          name: m27-normative-edc-internal-evidence
          path: /tmp/m27/internal/
          retention-days: 30
