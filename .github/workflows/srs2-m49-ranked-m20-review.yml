name: SRS Guardian M49 Real-Source M20 Review Handoff
on:
  push:
    branches:
      - feature/srs-guardian2-m49-ranked-m20-review-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m49_ranked_m20_review.py'
      - 'backend/tests/test_m49_ranked_m20_review.py'
      - '.github/workflows/srs2-m49-ranked-m20-review.yml'
permissions:
  contents: read
jobs:
  first-party-review-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: First-party unit checks (synthetic inputs, no upstream execution)
        run: python -m pytest -q backend/tests/test_m49_ranked_m20_review.py
      - name: Verify pinned upstream inert source and generate M20 packets
        run: python -m backend.evaluation.m49_ranked_m20_review --out-dir m49_evidence
      - name: Archive review evidence; do not treat as gold
        uses: actions/upload-artifact@v4
        with:
          name: m49-pending-pip-m20-review-not-gold
          path: m49_evidence/
          retention-days: 14
