name: SRS Guardian 2 M10 Multi-Module Endpoint Binding
on:
  push:
    branches:
      - feature/srs-guardian2-m10-multimodule-endpoint-binding-20261026
  pull_request:
    paths:
      - 'backend/app/research/approved_runner.py'
      - 'backend/app/research/m4_worker.py'
      - 'backend/evaluation/m10_multimodule_docker_e2e.py'
      - 'backend/tests/test_m10_multimodule_binding.py'
      - 'examples/m10/**'
      - '.github/workflows/srs2-m10-multimodule.yml'
permissions:
  contents: read
jobs:
  combined-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install 'fastapi==0.115.12' 'httpx==0.28.1' 'pytest==8.4.2' 'python-multipart==0.0.20' 'SQLAlchemy==2.0.44' 'scikit-learn==1.7.2'
      - name: Compile changed Python files
        run: python -m compileall -q backend/app/research backend/evaluation backend/tests/test_m10_multimodule_binding.py examples/m10
      - name: Run M1-M10 focused regression
        run: |
          python -m pytest -q \
            backend/tests/test_evaluate_conformance.py \
            backend/tests/test_code_traceability.py \
            backend/tests/test_conformance_verification.py \
            backend/tests/test_m4_approved_runner.py \
            backend/tests/test_m5_research_benchmark.py \
            backend/tests/test_m6_external_trace.py \
            backend/tests/test_m7_hybrid_retrieval.py \
            backend/tests/test_m9_source_binding.py \
            backend/tests/test_m10_multimodule_binding.py
  real-docker-multimodule:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned integration dependencies
        run: python -m pip install 'fastapi==0.115.12' 'httpx==0.28.1' 'python-multipart==0.0.20' 'SQLAlchemy==2.0.44'
      - name: Build reviewed image with separate FastAPI router modules
        run: |
          unset DOCKER_HOST
          docker info --format 'Local Docker: {{.ServerVersion}}'
          docker build -f examples/m4/Dockerfile -t srs-m8-trusted-banking:ci .
      - name: Verify real source-bound HTTP responses for correct and faulty routers
        run: |
          python -m backend.evaluation.m10_multimodule_docker_e2e --out /tmp/m10-multimodule.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/m10-multimodule.json'))
          assert r['docker_executed'] and r['all_expectations_met']
          assert r['research_95_eligible'] is False
          assert [x['observed_decision'] for x in r['results']] == ['passed_available_checks','observed_violation']
          assert all(x['source_content_binding']=='worker_reported_endpoint_digest_matches_index' for x in r['results'])
          assert all(x['executed_endpoint_sha256']==x['source_sha256'] for x in r['results'])
          assert all(x['executed_module_sha256']!=x['source_sha256'] for x in r['results'])
          print('Real Docker verified distinct ASGI app and router modules')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m10-real-docker-multimodule-evidence
          path: /tmp/m10-multimodule.json
          retention-days: 14
