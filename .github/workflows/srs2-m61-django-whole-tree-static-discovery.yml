name: M61 Django Whole-Tree Static Discovery (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m61-whole-tree-static-discovery-20261029
  pull_request:
    paths:
      - 'backend/evaluation/m61_django_whole_tree_static_discovery.py'
      - 'backend/tests/test_m61_django_whole_tree_static_discovery.py'
      - '.github/workflows/srs2-m61-django-whole-tree-static-discovery.yml'
permissions:
  contents: read
jobs:
  static-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned first-party test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: First-party synthetic tests (no external project execution)
        run: python -m pytest -q backend/tests/test_m61_django_whole_tree_static_discovery.py
      - name: Fetch pinned Django source trees as inert bytes and inspect AST
        run: python -m backend.evaluation.m61_django_whole_tree_static_discovery --out-dir /tmp/m61_django
      - name: Verify real-source static discovery evidence only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/m61_django/INTERNAL_WHOLE_TREE_STATIC_NOT_GOLD.json').read_text())
          assert len(data['revisions']) == 2
          assert [r['static_result'] for r in data['revisions']] == ['static_rule_violated', 'static_rule_satisfied']
          assert all(r['verified_production_files_scanned'] >= 100 for r in data['revisions'])
          assert all(r['candidate_count'] == 1 and r['source_line'] > 0 for r in data['revisions'])
          assert data['file_path_oracle_used'] is False
          assert data['symbol_and_rule_oracle_informed'] is True
          assert data['external_project_code_executed'] is False
          assert data['independent_link_labels'] == 0
          assert data['independent_behavioral_observations'] == 0
          assert data['independent_adjudications'] == 0
          assert data['held_out_projects_scored'] == 0
          assert all(data[k] is None for k in ('conformance_accuracy', 'violation_precision', 'violation_recall', 'coverage'))
          print('Verified two real-source full-tree static witnesses; NOT behavioral or independent gold')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m61-django-whole-tree-static-development-NOT-GOLD
          path: /tmp/m61_django/
          retention-days: 14
