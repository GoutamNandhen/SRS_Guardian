name: SRS2 M44 Requests independent review candidate
on:
  push:
    branches:
      - feature/srs-guardian2-m44-requests-independent-review-20261028
  pull_request:
    paths:
      - backend/evaluation/m44_requests_independent_review.py
      - backend/tests/test_m44_requests_independent_review.py
      - .github/workflows/srs2-m44-requests-review.yml
      - docs/research/M44_REQUESTS_INDEPENDENT_REVIEW.md
  workflow_dispatch:

jobs:
  verified-source-review-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install first-party test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: Verify pinned upstream source and blinded reviewer handoff
        run: python -m pytest -q backend/tests/test_m44_requests_independent_review.py
      - name: Generate reproducible M20 reviewer handoff (upstream source never executed)
        run: python -m backend.evaluation.m44_requests_independent_review --out-dir /tmp/m44
      - uses: actions/upload-artifact@v4
        with:
          name: m44-requests-review-pending-not-gold
          path: /tmp/m44/
          retention-days: 14
