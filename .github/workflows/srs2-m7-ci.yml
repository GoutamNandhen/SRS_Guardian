name: SRS Guardian 2 M7 Hybrid Retrieval Experiment
on:
  push:
    branches:
      - feature/srs-guardian2-m7-hybrid-path-retrieval-20261026
  pull_request:
    paths:
      - 'backend/evaluation/m7_hybrid_retrieval.py'
      - 'backend/tests/test_m7_hybrid_retrieval.py'
      - '.github/workflows/srs2-m7-ci.yml'
permissions:
  contents: read
jobs:
  external-subword-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only evaluation dependencies
        run: python -m pip install 'pytest==8.4.2' 'scikit-learn==1.7.2'
      - name: Run M6 and M7 tests
        run: python -m pytest -q backend/tests/test_m6_external_trace.py backend/tests/test_m7_hybrid_retrieval.py
      - name: Run external fixture experiment (not conformance accuracy)
        run: |
          python -m backend.evaluation.m7_hybrid_retrieval --dataset benchmarks/m6/dronology_observed_trace_links.json --output /tmp/m7_external_results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/m7_external_results.json').read_text())
          assert not data['research_95_eligible']
          assert not data['has_true_negatives']
          assert not data['is_m2_ast_evaluation']
          assert not data['has_executable_conformance_labels']
          assert data['independent_projects'] == 1
          assert len(data['runs']) == 8
          assert len(data['paired']) == 8
          print('M7 passed scope guard: path retrieval, NOT 95% verification accuracy')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m7-external-hybrid-retrieval
          path: /tmp/m7_external_results.json
          retention-days: 14
