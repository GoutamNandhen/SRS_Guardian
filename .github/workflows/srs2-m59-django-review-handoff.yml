name: M59 Django Source + Regression Review Handoff (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m59-django-reviewable-evidence-20261029
  pull_request:
    paths:
      - 'backend/evaluation/m59_django_two_stage_review.py'
      - 'backend/tests/test_m59_django_two_stage_review.py'
      - '.github/workflows/srs2-m59-django-review-handoff.yml'
permissions:
  contents: read
jobs:
  evidence-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned first-party test and inert Parquet reader
        run: python -m pip install 'pytest==8.4.2' 'pyarrow==17.0.0'
      - name: Offline synthetic first-party tests only
        run: python -m pytest -q backend/tests/test_m59_django_two_stage_review.py
      - name: Generate real pinned Django source and regression review packets (never execute Django)
        run: python -m backend.evaluation.m59_django_two_stage_review --out-dir /tmp/m59_django
      - name: Verify distinct stage 1 and stage 2 evidence and no invented labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/m59_django')
          internal = json.loads((p / 'INTERNAL_NOT_GOLD.json').read_text())
          assert internal['project'] == 'django/django'
          assert internal['source_candidates_per_reviewer'] == 5
          assert internal['candidate_regression_tests'] >= 1
          assert internal['independent_link_labels'] == 0
          assert internal['independent_behavioral_observations'] == 0
          assert internal['independent_adjudications'] == 0
          assert internal['held_out_projects_scored'] == 0
          assert internal['external_project_code_executed'] is False
          assert all(internal[k] is None for k in (
              'conformance_accuracy', 'violation_precision', 'violation_recall', 'coverage'))
          for r in ('A', 'B'):
              links = [json.loads(x) for x in
                       (p / f'reviewer_{r}_stage1.jsonl').read_text().splitlines()]
              assert len(links) == 5
              assert all(x['source_excerpt']['source_lines'] for x in links)
              assert all(x['independent_link_decision'] is None for x in links)
              assert all('candidate_test_patch_UNTRUSTED_TEXT' not in x for x in links)
              tests = json.loads((p / f'reviewer_{r}_stage2.json').read_text())
              assert tests['independent_behavioral_label'] is None
              assert tests['before_revision_observation'] is None
              assert tests['after_revision_observation'] is None
          print('Real source excerpts + upstream regression evidence prepared; NOT GOLD')
          PY
      - name: Upload separate two-stage independent review packets
        uses: actions/upload-artifact@v4
        with:
          name: m59-django-two-stage-review-NOT-GOLD
          path: /tmp/m59_django/
          retention-days: 14
