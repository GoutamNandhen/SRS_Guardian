name: M54 Pinned SymPy Whole-Tree Retrieval to M20 (NOT GOLD)
on:
  push:
    branches:
      - feature/srs-guardian2-m54-sympy-frozen-retrieval-20261029
  pull_request:
    paths:
      - 'backend/evaluation/m54_sympy_frozen_retrieval_review.py'
      - 'backend/tests/test_m54_sympy_frozen_retrieval_review.py'
      - '.github/workflows/srs2-m54-sympy-frozen-retrieval.yml'
permissions:
  contents: read
jobs:
  static-pinned-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned first-party test runner and inert Parquet reader
        run: python -m pip install 'pytest==8.4.2' 'pyarrow==17.0.0'
      - name: Offline first-party tests; no upstream imports
        run: python -m pytest -q backend/tests/test_m54_sympy_frozen_retrieval_review.py
      - name: Verify pinned SymPy production tree; frozen M42 retrieval; M20 queue
        run: python -m backend.evaluation.m54_sympy_frozen_retrieval_review --out-dir /tmp/m54_sympy
      - name: Assert no invented behavioral scores
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/m54_sympy')
          data = json.loads((p/'INTERNAL_DO_NOT_SHARE.json').read_text())
          assert data['verified_production_python_files'] >= 50
          assert data['indexed_production_symbols'] >= 5
          assert data['external_code_executed'] is False
          assert data['independent_link_labels'] == 0
          assert data['independent_behavioral_labels'] == 0
          assert data['independent_adjudications'] == 0
          assert data['held_out_projects_scored'] == 0
          assert all(data[k] is None for k in ('conformance_accuracy','violation_precision','violation_recall','coverage'))
          assert len((p/'reviewer_A.jsonl').read_text().splitlines()) == 5
          assert len((p/'reviewer_B.jsonl').read_text().splitlines()) == 5
          print('Pinned SymPy retrieval and pending M20 queue; NOT behavioral gold')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m54-sympy-frozen-retrieval-review-NOT-GOLD
          path: /tmp/m54_sympy/
          retention-days: 14
