name: SRS Guardian M39 Three-Project Adjudicator Workbench
on:
  push:
    branches:
      - feature/srs-guardian2-m39-three-project-adjudicator-workbench-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m39_three_project_adjudicator_workbench.py'
      - 'backend/tests/test_m39_three_project_adjudicator_workbench.py'
      - 'docs/research/M39_THREE_PROJECT_ADJUDICATOR_WORKBENCH.md'
      - '.github/workflows/srs2-m39-adjudicator-workbench.yml'
permissions:
  contents: read
jobs:
  generate-unadjudicated-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: First-party tests (synthetic fixtures, never research scores)
        run: python -m pytest -q backend/tests/test_m36_adjudication_handoff.py backend/tests/test_m39_three_project_adjudicator_workbench.py
      - name: Generate pinned static reviewer seeds; do not run external code
        run: |
          python -m backend.evaluation.m35_independent_review_workspace --out-dir /tmp/m39/reviews
          python -m backend.evaluation.m38_werkzeug_offline_review --out-dir /tmp/m39/werkzeug_source
          mkdir -p /tmp/m39/reviews/werkzeug/reviewers
          for r in A B; do
            cp "/tmp/m39/werkzeug_source/reviewer_${r}/link_seed.jsonl" "/tmp/m39/reviews/werkzeug/reviewers/reviewer_${r}.jsonl"
            cp "/tmp/m39/werkzeug_source/reviewer_${r}/behavior_seed.jsonl" "/tmp/m39/reviews/werkzeug/reviewers/behavior_reviewer_${r}.jsonl"
          done
          python -m backend.evaluation.m39_three_project_adjudicator_workbench --review-root /tmp/m39/reviews --out-dir /tmp/m39/handoff
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/m39/handoff')
          m=json.loads((root/'adjudication_manifest.json').read_text())
          assert m['projects']==3 and m['tasks']==30
          assert m['cases_per_project']=={'edc':8,'pip':12,'werkzeug':10}
          assert m['comparison_counts']['pending_or_incomplete']==30
          assert m['independent_adjudications']==0
          assert not m['external_project_code_executed']
          assert all(v is None for v in m['metrics'].values())
          assert (root/'adjudicator_workbench.html').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m39-three-project-adjudicator-workbench-PENDING-NOT-GOLD
          path: /tmp/m39/handoff/
          retention-days: 14
