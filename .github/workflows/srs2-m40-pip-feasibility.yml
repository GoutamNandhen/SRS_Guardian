name: SRS Guardian M40 Pip End-to-End Feasibility
on:
  push:
    branches:
      - feature/srs-guardian2-m40-pip-e2e-feasibility-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m40_pip_e2e_feasibility.py'
      - 'backend/tests/test_m40_pip_e2e_feasibility.py'
      - 'docs/research/M40_PIP_E2E_FEASIBILITY.md'
      - '.github/workflows/srs2-m40-pip-feasibility.yml'
permissions:
  contents: read
jobs:
  pinned-pip-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.4.2'
      - name: First-party tests only
        run: python -m pytest -q backend/tests/test_m34_pip_source_structure_witness.py backend/tests/test_m40_pip_e2e_feasibility.py
      - name: Verify pinned MIT source and run actual M2 retrieval plus M34 structural witness
        run: |
          python -m backend.evaluation.m40_pip_e2e_feasibility --out-dir /tmp/m40
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('/tmp/m40/pip_e2e_feasibility.json').read_text())
          assert m['verified_static_file_revision_objects'] == 6
          assert m['revision_requirement_pairs'] == 6
          assert m['behavioral_abstentions'] == 6
          assert m['behavioral_decisions'] == 0
          assert m['independent_adjudications'] == 0
          assert m['held_out_project_evaluation'] is False
          assert m['external_project_code_executed'] is False
          assert m['per_revision']['before']['structural_property_present'] is False
          assert m['per_revision']['after']['structural_property_present'] is True
          assert all(v is None for v in m['metrics'].values())
          assert all(row['decision'] == 'insufficient_evidence' for row in m['cases'])
          print('Real-source retrieval diagnostic top-1:',
                m['known_fix_locus_top1_count_exploratory'], '/ 6')
          print('Real-source retrieval diagnostic top-5:',
                m['known_fix_locus_top5_count_exploratory'], '/ 6')
          print('Behavioral abstentions: 6/6; independent labels: 0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m40-pip-real-source-feasibility-NOT-GOLD
          path: /tmp/m40/
          retention-days: 14
