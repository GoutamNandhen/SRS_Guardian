name: SRS Guardian M29 Real pip Regression Evidence
on:
  push:
    branches:
      - feature/srs-guardian2-m29-pip-real-regression-20261028
  pull_request:
    paths:
      - 'backend/evaluation/m29_pip_historical_regression.py'
      - 'backend/tests/test_m29_pip_historical_regression.py'
      - '.github/workflows/srs2-m29-pip-regression.yml'
permissions:
  contents: read
jobs:
  pinned-pip-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependency
        run: python -m pip install 'pytest==8.4.2'
      - name: Run only our offline M20 and M29 tests
        run: |
          python -m pytest -q \
            backend/tests/test_m20_annotation_queue.py \
            backend/tests/test_m29_pip_historical_regression.py
      - name: Fetch and verify six pinned static pip objects, then create review packets
        run: python -m backend.evaluation.m29_pip_historical_regression --out-dir /tmp/m29
      - name: Verify separation and unanswered behavior labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/m29')
          internal = json.loads((root / 'internal' / 'internal.json').read_text())
          assert internal['static_file_revision_objects_verified'] == 6
          assert internal['distinct_git_blobs_verified'] == 5
          assert internal['upstream_behavior_scenarios'] == 3
          assert internal['m20_link_pairs_pending'] == 6
          assert internal['behavior_revision_cases_pending_per_reviewer'] == 6
          assert internal['independently_adjudicated_behavior_cases'] == 0
          assert internal['independently_adjudicated_links'] == 0
          assert internal['external_code_executed'] is False
          assert internal['representative_held_out'] is False
          assert not (root / 'reviewers' / 'manifest.json').exists()
          for metric in ('conformance_accuracy', 'violation_precision', 'violation_recall', 'conformance_coverage'):
              assert internal[metric] is None
          for reviewer in ('A', 'B'):
              links = [json.loads(s) for s in (root / 'reviewers' / f'reviewer_{reviewer}.jsonl').read_text().splitlines()]
              behavior = [json.loads(s) for s in (root / 'reviewers' / f'behavior_reviewer_{reviewer}.jsonl').read_text().splitlines()]
              assert len(links) == len(behavior) == 6
              assert all(r['link_label'] is None for r in links)
              assert all(r['observed_behavior'] is None and r['conformance_label'] is None and r['violation_label'] is None for r in behavior)
          print('M29 verified: 6 pinned file/revision objects, 3 scenarios, 6 M20 pairs, 6 behavior cases per reviewer, zero adjudications.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m29-pip-blinded-reviewers
          path: /tmp/m29/reviewers/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: m29-pip-internal-provenance
          path: /tmp/m29/internal/
          retention-days: 30
