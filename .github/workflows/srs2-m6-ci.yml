name: SRS Guardian 2 M6 External Trace Evaluation
on:
  push:
    branches:
      - feature/srs-guardian2-m6-external-traceability-20261026
  pull_request:
    paths:
      - 'backend/evaluation/m6_external_trace.py'
      - 'backend/tests/test_m6_external_trace.py'
      - 'benchmarks/m6/**'
      - '.github/workflows/srs2-m6-ci.yml'
permissions:
  contents: read
jobs:
  external-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: Compile and validate external trace evaluator
        run: |
          python -m compileall -q backend/evaluation/m6_external_trace.py
          python -m pytest -q backend/tests/test_m6_external_trace.py
      - name: Evaluate recorded external positive-only traces
        run: |
          python -m backend.evaluation.m6_external_trace --dataset benchmarks/m6/dronology_observed_trace_links.json --output /tmp/m6_external_trace_results.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/m6_external_trace_results.json',encoding='utf-8'))
          assert d['research_95_eligible'] is False
          assert d['has_true_negatives'] is False
          assert d['independent_projects'] == 1
          assert d['has_executable_conformance_labels'] is False
          assert sorted((r['version'], r['requirements_with_observed_code_link']) for r in d['runs'] if r['method']=='path_bm25')==[('V0',8),('V1',10)]
          print('PUBLICATION GATE: external pilot is INELIGIBLE for 95% conformance claim')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m6-observed-positive-trace-results
          path: /tmp/m6_external_trace_results.json
          retention-days: 14
