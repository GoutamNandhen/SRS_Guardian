name: SRS Guardian M23 TeaStore External Annotation Evidence
on:
  push:
    branches:
      - feature/srs-guardian2-m23-teastore-pinned-annotation-20261027
  pull_request:
    paths:
      - 'backend/evaluation/m23_teastore_external.py'
      - 'backend/tests/test_m23_teastore_external.py'
      - '.github/workflows/srs2-m23-teastore.yml'
permissions:
  contents: read
jobs:
  teastore-pinned-static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'pytest==8.4.2'
      - name: Verify offline parsing and pinned-source failure modes
        run: python -m pytest -q backend/tests/test_m20_annotation_queue.py backend/tests/test_m23_teastore_external.py
      - name: Fetch and verify two pinned licensed repositories; generate M20 blind queues
        run: python -m backend.evaluation.m23_teastore_external --out-dir /tmp/m23-teastore
      - name: Verify real static artifacts and absence of fabricated adjudication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/m23-teastore')
          evidence=json.loads((p/'external_evidence.json').read_text())
          universe=json.loads((p/'candidate_universe.json').read_text())
          manifest=json.loads((p/'annotation/manifest.json').read_text())
          blind=[json.loads(x) for x in (p/'annotation/blind_queue.jsonl').read_text().splitlines()]
          for reviewer in ('A','B'):
              rows=[json.loads(x) for x in (p/f'annotation/reviewer_{reviewer}.jsonl').read_text().splitlines()]
              assert len(rows)==15
              assert all(x['link_label'] is None and x['annotation_status']=='pending' for x in rows)
          assert len(evidence['source_files'])==11
          assert (evidence['selected_sad_sentences'],evidence['selected_java_files'])==(3,5)
          assert evidence['paper_declared_links_unverified']==6
          assert evidence['blinded_review_pairs']==15
          assert manifest['sampled_pairs']==15
          assert manifest['independent_labels_collected'] is False
          assert universe['source_commit']==evidence['code_commit']
          assert all('origin' not in row and 'link_label' not in row for row in blind)
          assert evidence['conformance_accuracy'] is None
          assert evidence['violation_precision'] is None
          assert evidence['violation_recall'] is None
          assert evidence['conformance_coverage'] is None
          assert evidence['research_95_eligible'] is False
          print('M23: two pinned licensed sources, 3 SAD sentences, 5 Java files, 6 unverified paper links, 15 unlabeled pairs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m23-teastore-external-source-and-blind-review-evidence
          path: /tmp/m23-teastore/
          retention-days: 30
